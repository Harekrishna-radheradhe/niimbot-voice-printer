<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIIMBOT B1 Pro Printer</title><style>body{font:16px system-ui;background:#f3f5fa;margin:0;padding:16px;color:#172033}main{max-width:500px;margin:auto;background:white;padding:22px;border-radius:16px}label{display:block;margin:16px 0 6px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{width:100%;padding:15px;margin-top:12px;background:#2458d3;color:white;border:0;border-radius:8px;font:inherit;font-weight:bold}button:disabled{opacity:.5}.preview{aspect-ratio:5/3;border:1px solid #aaa;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:20px 0;font-size:32px;font-weight:bold;text-align:center}#status{white-space:pre-wrap;margin-top:12px}canvas{display:none}</style></head><body><main><h2>NIIMBOT B1 Pro Printer</h2><p>50 × 30 mm · 300 dpi</p><label for="food">Food name</label><input id="food" value="SAMBAR"><label for="copies">Copies</label><input id="copies" type="number" min="1" max="30" value="2"><label for="price">Price (optional)</label><input id="price" placeholder="No price"><div class="preview"><span id="previewFood">SAMBAR</span><span id="previewPrice"></span></div><button id="connect">Connect Printer</button><button id="print" disabled>Print Labels</button><button id="disconnect">Disconnect</button><div id="status" role="status">Ready. Open in Chrome on Android.</div><canvas id="label" width="576" height="354"></canvas></main><script src="https://cdn.jsdelivr.net/gh/iscarelli/niimbot-web-bluetooth@main/src/niimbot.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const model={name_prefixes:['B1'],task:'v4',density:3,label_type:1,speed:1};const size={w_px:576,h_px:354};const status=s=>$('status').textContent=s;let connected=false;function setConnected(v){connected=v;$('print').disabled=!v;$('connect').disabled=v;}const food=()=>$('food').value.trim().toUpperCase();function preview(){$('previewFood').textContent=food()||'FOOD NAME';$('previewPrice').textContent=$('price').value.trim()?'$'+$('price').value.trim().replace(/^\$/,''):'';}$('food').addEventListener('input',preview);$('price').addEventListener('input',preview);
function makeLabel(){const c=$('label'),x=c.getContext('2d'),w=c.width,h=c.height,p=$('price').value.trim();x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';let f=81;x.font='bold '+f+'px Arial';while(f>28&&x.measureText(food()).width>w-48){f-=2;x.font='bold '+f+'px Arial';}x.fillText(food(),w/2,p?142:177,w-45);if(p){x.font='bold 57px Arial';x.fillText('$'+p.replace(/^\$/,''),w/2,252,w-45);}return c.toDataURL('image/png');}
$('connect').addEventListener('click',async()=>{if(!window.Niimbot){status('Driver failed to load.');return;}if(!Niimbot.isSupported()){status('Use Chrome on Android over HTTPS.');return;}$('connect').disabled=true;try{status('Choose NIIMBOT B1 Pro in Bluetooth chooser…');await Niimbot.connect(model);const p=Niimbot.printer;if(p&&p.task!=='v4')throw new Error('Connected '+p.label+' uses task '+p.task+', not B1 Pro v4.');setConnected(true);status('Connected to '+(p?.label||'NIIMBOT B1 Pro')+'. Ready to print.');}catch(e){setConnected(false);status('Connection error: '+(e?.message||String(e)));try{await Niimbot.disconnect();}catch(_){}}});
$('print').addEventListener('click',async()=>{const count=Number($('copies').value);if(!connected){status('Connect the printer first.');return;}if(!food()){status('Enter a food name.');return;}if(!Number.isInteger(count)||count<1||count>30){status('Copies must be 1–30.');return;}$('print').disabled=true;try{status('Printing '+count+' × '+food()+'…');await Niimbot.printImage(makeLabel(),{model,size,copies:count,onProgress:s=>status(typeof s==='string'?s:JSON.stringify(s))});status('Printer confirmed '+count+' × '+food()+'. Ready for another print.');}catch(e){status('Printing error: '+(e?.message||String(e))+'\nCheck paper before retrying. If disconnected, tap Disconnect then Connect Printer.');}finally{$('print').disabled=!connected;}});
$('disconnect').addEventListener('click',async()=>{try{await Niimbot.disconnect();setConnected(false);status('Disconnected.');}catch(e){setConnected(false);status(String(e));}});preview();
</script></body></html>
