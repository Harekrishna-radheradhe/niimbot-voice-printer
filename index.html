<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIIMBOT B1 Pro Printer</title><style>body{font:16px system-ui;background:#f3f5fa;margin:0;padding:16px;color:#172033}main{max-width:500px;margin:auto;background:white;padding:22px;border-radius:16px}label{display:block;margin:16px 0 6px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{width:100%;padding:15px;margin-top:12px;background:#2458d3;color:white;border:0;border-radius:8px;font:inherit;font-weight:bold}button:disabled{opacity:.5}.preview{aspect-ratio:5/3;border:1px solid #aaa;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:20px 0;font-size:32px;font-weight:bold;text-align:center}#status{white-space:pre-wrap;margin-top:12px}canvas{display:none}.voicebox{background:#edf3ff;padding:12px;border-radius:10px;margin-top:16px}.voicebox button{margin-top:6px}.small{font-size:13px;color:#42526a}.confirm{background:#fff7db;border:1px solid #e9cf73;padding:12px;border-radius:10px;margin-top:12px}.confirm button{background:#18794e}.confirm button.secondary{background:#64748b}.dictrow{display:flex;gap:8px}.dictrow input{min-width:0}.dictrow button{width:auto;margin:0;padding:10px}.hidden{display:none}</style></head><body><main><h2>NIIMBOT B1 Pro Printer</h2><p>50 × 30 mm · 300 dpi</p><label for="food">Food name</label><input id="food" value="SAMBAR"><label for="copies">Copies</label><input id="copies" type="number" min="1" max="30" value="2"><label for="price">Price (optional)</label><input id="price" placeholder="No price"><div class="preview"><span id="previewFood">SAMBAR</span><span id="previewPrice"></span></div><section class="voicebox"><strong>Voice command</strong><p class="small">Tap the microphone, then say “Print two Sambar labels”.</p><button id="mic" type="button">🎤 Speak Print Command</button><div id="heard" class="small" aria-live="polite"></div></section><div id="confirmBox" class="confirm hidden"><strong id="confirmText"></strong><button id="confirmPrint" type="button">Confirm &amp; Print</button><button id="cancelVoice" class="secondary" type="button">Cancel Voice Order</button></div><details><summary>Saved food names &amp; speech corrections</summary><p class="small">Enter the correct food name and words the microphone might hear instead. Saved on this phone only.</p><label for="canonical">Correct food name</label><input id="canonical" placeholder="AVIAL"><label for="aliases">Speech alternatives (comma separated)</label><input id="aliases" placeholder="a vial, aviyal"><button id="saveFood" type="button">Save Food Name</button><div id="savedFoods" class="small"></div></details><button id="connect">Connect Printer</button><button id="print" disabled>Print Labels</button><button id="disconnect">Disconnect</button><div id="status" role="status">Ready. Open in Chrome on Android.</div><canvas id="label" width="576" height="354"></canvas></main><script src="https://cdn.jsdelivr.net/gh/iscarelli/niimbot-web-bluetooth@main/src/niimbot.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const model={name_prefixes:['B1'],task:'v4',density:3,label_type:1,speed:1};const size={w_px:576,h_px:354};const status=s=>$('status').textContent=s;let connected=false;function setConnected(v){connected=v;$('print').disabled=!v;$('connect').disabled=v;}const food=()=>$('food').value.trim().toUpperCase();function preview(){$('previewFood').textContent=food()||'FOOD NAME';$('previewPrice').textContent=$('price').value.trim()?'$'+$('price').value.trim().replace(/^\$/,''):'';}$('food').addEventListener('input',preview);$('price').addEventListener('input',preview);
function makeLabel(){const c=$('label'),x=c.getContext('2d'),w=c.width,h=c.height,p=$('price').value.trim();x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';let f=81;x.font='bold '+f+'px Arial';while(f>28&&x.measureText(food()).width>w-48){f-=2;x.font='bold '+f+'px Arial';}x.fillText(food(),w/2,p?142:177,w-45);if(p){x.font='bold 57px Arial';x.fillText('$'+p.replace(/^\$/,''),w/2,252,w-45);}return c.toDataURL('image/png');}
$('connect').addEventListener('click',async()=>{if(!window.Niimbot){status('Driver failed to load.');return;}if(!Niimbot.isSupported()){status('Use Chrome on Android over HTTPS.');return;}$('connect').disabled=true;try{status('Choose NIIMBOT B1 Pro in Bluetooth chooser…');await Niimbot.connect(model);const p=Niimbot.printer;if(p&&p.task!=='v4')throw new Error('Connected '+p.label+' uses task '+p.task+', not B1 Pro v4.');setConnected(true);status('Connected to '+(p?.label||'NIIMBOT B1 Pro')+'. Ready to print.');}catch(e){setConnected(false);status('Connection error: '+(e?.message||String(e)));try{await Niimbot.disconnect();}catch(_){}}});
$('print').addEventListener('click',async()=>{const count=Number($('copies').value);if(!connected){status('Connect the printer first.');return;}if(!food()){status('Enter a food name.');return;}if(!Number.isInteger(count)||count<1||count>30){status('Copies must be 1–30.');return;}$('print').disabled=true;try{status('Printing '+count+' × '+food()+'…');await Niimbot.printImage(makeLabel(),{model,size,copies:count,onProgress:s=>status(typeof s==='string'?s:JSON.stringify(s))});status('Printer confirmed '+count+' × '+food()+'. Ready for another print.');}catch(e){status('Printing error: '+(e?.message||String(e))+'\nCheck paper before retrying. If disconnected, tap Disconnect then Connect Printer.');}finally{$('print').disabled=!connected;}});
$('disconnect').addEventListener('click',async()=>{try{await Niimbot.disconnect();setConnected(false);status('Disconnected.');}catch(e){setConnected(false);status(String(e));}});preview();

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;let awaitingVoiceConfirmation=false;
const defaultFoods=[{name:'SAMBAR',aliases:['sambar','sambhar','summer','some bar']},{name:'AVIAL',aliases:['avial','aviyal','a vial']},{name:'PULIHORA',aliases:['pulihora','puli hora']}];
let dictionary;
try{const stored=JSON.parse(localStorage.getItem('niimbotFoodDictionary')||'null');dictionary=Array.isArray(stored)?stored:defaultFoods;}catch(_){dictionary=defaultFoods;}
function saveDictionary(){try{localStorage.setItem('niimbotFoodDictionary',JSON.stringify(dictionary));}catch(_){status('Could not save food dictionary on this browser.');}renderDictionary();}
function renderDictionary(){$('savedFoods').textContent=dictionary.map(e=>e.name+' ('+e.aliases.join(', ')+')').join(' • ');}
$('saveFood').addEventListener('click',()=>{const name=$('canonical').value.trim().toUpperCase();if(!name){status('Enter a food name to save.');return;}const aliases=$('aliases').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);const item={name,aliases:[name.toLowerCase(),...aliases]};const index=dictionary.findIndex(e=>e.name===name);if(index>=0)dictionary[index]=item;else dictionary.push(item);saveDictionary();status('Saved '+name+' on this phone.');$('canonical').value='';$('aliases').value='';});
function normalizeSpeech(v){return v.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
const numbers={coffee:2,copy:1,to:2,too:2,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,twenty:20,thirty:30};
function parseVoice(utterance){
 let t=' '+normalizeSpeech(utterance)+' '; t=t.replace(/\bprinter\b/g,' print '); t=t.replace(/\bto coffee\b/g,' two copies ');
 t=t.replace(/^\s*(?:please\s+)?(?:print|make|give me)\s+/,' ');
 let count=null;
 const qty=/(?:\b(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|twenty|thirty)\s*(?:labels?|copies|stickers?)\b)|(?:\b(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|twenty|thirty)\b)/g;
 let m;let matches=[];
 while((m=qty.exec(t))!==null){let n=numbers[m[1]||m[2]]??Number(m[1]||m[2]);if(n>=1&&n<=30)matches.push({start:m.index,end:qty.lastIndex,n});}
 if(matches.length){const q=matches[0];count=q.n;t=t.slice(0,q.start)+' '+t.slice(q.end);}
 t=t.replace(/\b(?:labels?|copies|stickers?|of|for|please|print|make)\b/g,' ').replace(/\s+/g,' ').trim();
 let match=null;let best=0;const spoken=normalizeSpeech(t);
 for(const entry of dictionary){for(const alias of [entry.name,...entry.aliases]){const a=normalizeSpeech(alias);if(a&&(spoken===a||(' '+spoken+' ').includes(' '+a+' '))&&a.length>best){match=entry.name;best=a.length;}}}
 return {food:match||t.toUpperCase(),copies:count||Number($('copies').value)||1,matched:!!match};
}
function hideVoiceConfirmation(){awaitingVoiceConfirmation=false;$('confirmBox').classList.add('hidden');}
$('food').addEventListener('input',hideVoiceConfirmation);$('copies').addEventListener('input',hideVoiceConfirmation);$('price').addEventListener('input',hideVoiceConfirmation);
$('cancelVoice').addEventListener('click',()=>{hideVoiceConfirmation();status('Voice order cancelled.');});
$('confirmPrint').addEventListener('click',()=>{if(!awaitingVoiceConfirmation)return;hideVoiceConfirmation();if(!connected){status('Voice order prepared. Connect Printer first, then tap Print Labels.');return;}$('print').click();});
function say(text,done){if(!window.speechSynthesis){status('Speech playback unavailable. Confirm on screen.');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;u.onend=()=>{if(done)done();};u.onerror=()=>status('Voice playback failed. Confirm on screen.');speechSynthesis.speak(u);}catch(e){status('Speech playback failed: '+e.message);}}
function listenForConfirmation(){if(!SpeechRecognition)return;const r=new SpeechRecognition();recognition=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;let responded=false;
r.onresult=e=>{responded=true;const response=normalizeSpeech(e.results[0][0].transcript);$('heard').textContent='Confirmation heard: '+response;
if(/\b(yes|yeah|yep|correct|confirm|okay|ok|print)\b/.test(response)){if(!awaitingVoiceConfirmation)return;hideVoiceConfirmation();if(connected){$('print').click();say('Printing now.');}else{status('Connect Printer first. Order is ready.');say('Printer is not connected. Please connect the printer.');}}
else if(/\b(no|cancel|stop|wrong)\b/.test(response)){hideVoiceConfirmation();status('Voice order cancelled.');say('Cancelled.');}
else{status('Confirmation not understood. Use on-screen confirmation or tap microphone again.');}};
r.onerror=e=>status('Confirmation microphone error: '+e.error+'. You can use the on-screen buttons.');
r.onend=()=>{$('mic').disabled=false;if(!responded&&awaitingVoiceConfirmation)status('No spoken confirmation detected. You can confirm on screen or retry the microphone.');};
try{r.start();status('Listening for YES or NO…');}catch(e){$('mic').disabled=false;status('Chrome blocked automatic microphone restart. Confirm on screen or tap microphone again: '+e.message);}
}
$('mic').addEventListener('click',()=>{
 if(!SpeechRecognition){status('Voice recognition is not available in this browser. Try Chrome on Android.');return;}
 hideVoiceConfirmation();const r=new SpeechRecognition();recognition=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;
 $('mic').disabled=true;$('heard').textContent='Listening…';let order=null;
 r.onresult=e=>{const spoken=e.results[0][0].transcript;order=parseVoice(spoken);$('heard').textContent='Heard: '+spoken;
 if(!order.food||!order.matched||!Number.isInteger(order.copies)||order.copies<1||order.copies>30){status('Could not safely match a saved food name. Add a speech alternative or retry. Nothing printed.');order=null;return;}
 $('food').value=order.food;$('copies').value=order.copies;preview();awaitingVoiceConfirmation=true;
 $('confirmText').textContent='Print '+order.copies+' × '+order.food+'? Say YES or NO.';
 $('confirmBox').classList.remove('hidden');status('Voice order ready. Waiting to ask for spoken confirmation.');
 };
 r.onerror=e=>{status('Microphone error: '+e.error);$('heard').textContent='';};
 r.onend=()=>{if(order&&awaitingVoiceConfirmation){say(order.food+', '+order.copies+' labels. Is that correct? Say yes or no.',listenForConfirmation);}else{$('mic').disabled=false;}};
 try{r.start();}catch(e){$('mic').disabled=false;status('Could not start microphone: '+e.message);}
});
renderDictionary();
</script></body></html>
