<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIIMBOT B1 Label Printer</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#172033;background:#f4f6fa}body{margin:0;padding:20px}main{max-width:520px;margin:12px auto;background:white;border-radius:18px;padding:24px;box-shadow:0 5px 25px #1d294015}h1{font-size:24px;margin:0 0 5px}p{color:#566277}label{display:block;font-weight:650;margin:16px 0 6px}input{box-sizing:border-box;width:100%;font:inherit;border:1px solid #bbc4d3;border-radius:9px;padding:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-wrap{background:#e9edf3;padding:22px;border-radius:12px;margin:20px 0}.preview{background:white;border:1px solid #adb5c2;aspect-ratio:5/3;display:flex;justify-content:center;align-items:center;flex-direction:column;overflow:hidden}.preview strong{font-size:clamp(18px,6vw,37px);overflow-wrap:anywhere;text-align:center;padding:10px}.preview span{font-size:20px}button{width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;background:#2359db;color:white;cursor:pointer;margin-top:10px}button.secondary{background:#e6ecf8;color:#1d3973}button:disabled{opacity:.55;cursor:wait}#status{min-height:36px;margin-top:14px;font-size:14px;white-space:pre-wrap}.small{font-size:13px}canvas{display:none}</style></head><body><main>
<h1>NIIMBOT B1 Printer</h1><p>Browser label printer · 50 × 30 mm</p>
<label for="food">Food name</label><input id="food" value="SAMBAR" maxlength="60" autocomplete="off">
<div class="columns"><div><label for="copies">Copies</label><input id="copies" type="number" min="1" max="30" step="1" value="2"></div><div><label for="price">Price (optional)</label><input id="price" placeholder="No price" autocomplete="off"></div></div>
<div class="preview-wrap"><div class="preview"><strong id="previewFood">SAMBAR</strong><span id="previewPrice"></span></div></div>
<button id="print">Connect &amp; Print</button><button id="disconnect" class="secondary">Disconnect</button>
<div id="status" role="status" aria-live="polite">Ready. Use Chrome on Android, with Bluetooth enabled.</div>
<p class="small">Your browser will ask you to select the printer. The first connection must be started by tapping the button. This prototype does not yet support voice commands.</p>
<canvas id="label" width="384" height="240"></canvas>
</main>
<!-- Driver by iscarelli, MIT license. CDN loads the exact upstream file. -->
<script src="https://cdn.jsdelivr.net/gh/iscarelli/niimbot-web-bluetooth@main/src/niimbot.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const model = {name_prefixes:['B1'],task:'b1',density:3,label_type:1,speed:1};
const size = {w_px:384,h_px:240,offset_y_px:4};
const status = message => $('status').textContent = message;
const cleanFood = () => $('food').value.trim().toUpperCase();
function updatePreview(){ $('previewFood').textContent=cleanFood()||'FOOD NAME'; $('previewPrice').textContent=$('price').value.trim() ? '$'+$('price').value.trim().replace(/^\$/,'') : ''; }
$('food').addEventListener('input',updatePreview);$('price').addEventListener('input',updatePreview);
function makeLabel(){
 const canvas=$('label'),ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';
 const food=cleanFood(),price=$('price').value.trim();
 let font=54;ctx.font='bold '+font+'px Arial';
 while(font>19 && ctx.measureText(food).width>w-32){font-=2;ctx.font='bold '+font+'px Arial';}
 const y=price?96:120;ctx.fillText(food,w/2,y,w-30);
 if(price){ctx.font='bold 38px Arial';ctx.fillText('$'+price.replace(/^\$/,''),w/2,171,w-30);}
 return canvas.toDataURL('image/png');
}
$('print').addEventListener('click',async()=>{
 const food=cleanFood(),count=Number($('copies').value);
 if(!food){status('Enter a food name first.');return;}
 if(!Number.isInteger(count)||count<1||count>30){status('Copies must be a whole number from 1 to 30.');return;}
 if(!window.Niimbot){status('Printing driver could not load. Check internet connection and reload.');return;}
 if(!Niimbot.isSupported()){status('Web Bluetooth is not supported in this browser. Open the hosted page in Chrome on Android.');return;}
 $('print').disabled=true;
 try{
  status('Select your NIIMBOT B1 in the Bluetooth chooser…');
  const image=makeLabel();
  await Niimbot.printImage(image,{model,size,copies:count,onProgress:(s)=>status(typeof s==='string'?s:JSON.stringify(s))});
  status('Print job confirmed: '+count+' × '+food+'.');
 }catch(err){status('Printing error: '+(err?.message||String(err))+'\nIf labels partially printed, check the paper before retrying.');}
 finally{$('print').disabled=false;}
});
$('disconnect').addEventListener('click',async()=>{try{if(window.Niimbot)await Niimbot.disconnect();status('Disconnected.');}catch(err){status('Disconnect: '+(err?.message||err));}});
updatePreview();
</script></body></html>
